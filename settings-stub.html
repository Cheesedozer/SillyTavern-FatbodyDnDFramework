<div class="rpg-tracker-settings rt-settings-stub">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Origins RPG Framework</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="flex-container flexFlowColumn gap-1">
                <label class="checkbox_label">
                    <input id="rpg_tracker_enabled" type="checkbox" />
                    <span>Enable RPG Tracker</span>
                    <i class="fa-solid fa-circle-question interactable"
                        title="Master on/off — global across ALL chats, not just the one you're viewing. OFF removes the framework's D&amp;D system prompt from your Main prompt box and stops all injection (memo, RNG, quests, lore) — the model no longer runs the level/XP framing. ON re-applies it, and applies to every chat you open, not only a specific campaign. (In Suite/Custom Sysprompt modes the Main prompt box is left untouched.)"></i>
                </label>

                <button id="rpg_tracker_btn_open_settings" class="menu_button interactable"
                    style="width: 100%; margin-top: 6px; background: rgba(80, 140, 255, 0.18); border-color: #5588ff;"
                    title="Open the full Origins RPG Framework settings window.">
                    <i class="fa-solid fa-gears"></i> Open Settings
                </button>

                <button id="rpg_tracker_btn_show_hud" class="menu_button interactable"
                    style="width: 100%; margin-top: 6px; background: rgba(0, 200, 140, 0.18); border-color: #00c88c;"
                    title="Show or hide the floating HUD panel. Use this to bring the HUD back after closing it with the ✕ button — the choice is remembered across reloads.">
                    <i class="fa-solid fa-eye"></i> Show HUD
                </button>

                <button id="rpg_tracker_btn_reset_hud_stub" class="menu_button interactable"
                    style="width: 100%; margin-top: 6px; background: rgba(255, 170, 60, 0.15); border-color: #ffaa3c;"
                    title="Can't find the HUD at all? This rebuilds the panel, un-hides it, un-collapses it, and discards any saved position or size so it returns to its default corner. Same as the /hud reset slash command.">
                    <i class="fa-solid fa-arrows-rotate"></i> Reset HUD position
                </button>

                <button id="rpg_tracker_btn_foundation_wizard" class="menu_button interactable" style="width: 100%; margin-top: 6px; background: rgba(170, 85, 255, 0.15); border-color: #aa55ff;"
                    title="Custom RPG Progression (Modern mode): an AI architect interviews you about your world, then generates the campaign foundation — power system, classes, skill taxonomy, lethality. Commits lock the chat to Modern mode (level 1-100, skill trees).">
                    🏗️ Foundation Builder
                </button>
            </div>
        </div>
    </div>
</div>
